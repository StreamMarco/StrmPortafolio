<!DOCTYPE html>
<html lang="es" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Glass Interface // Minimal Editorial</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: DM Serif Display, Poppins, & Bebas Neue -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['"DM Serif Display"', 'serif'],
            sans: ['"Poppins"', 'sans-serif'],
            mono: ['"Bebas Neue"', 'sans-serif'],
            bebas: ['"Bebas Neue"', 'sans-serif'],
          },
          colors: {
            liquid: {
              bone: '#F4F2EC',
              boneLight: '#FAF8F4',
              boneDark: '#E4DFD5',
              charcoal: '#1A1D20',
              graphite: '#0C0F12',
              glassLight: 'rgba(255, 255, 255, 0.72)',
              glassDark: 'rgba(20, 24, 30, 0.65)',
              accent: '#E65D4F',
              cyan: '#00C2D1',
              amber: '#F5A623',
              emerald: '#10B981'
            }
          },
          boxShadow: {
            'liquid-sm': '0 4px 20px -2px rgba(30, 25, 20, 0.06), inset 0 1px 1px rgba(255, 255, 255, 0.9)',
            'liquid-md': '0 12px 35px -6px rgba(30, 25, 20, 0.08), inset 0 1.5px 2px rgba(255, 255, 255, 0.95)',
            'liquid-lg': '0 25px 60px -12px rgba(30, 25, 20, 0.12), inset 0 2px 3px rgba(255, 255, 255, 0.95)',
            'liquid-dark': '0 25px 60px -15px rgba(0, 0, 0, 0.75), inset 0 1px 1.5px rgba(255, 255, 255, 0.2)'
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(140, 135, 125, 0.3);
      border-radius: 9999px;
    }

    /* Level 1 Scroll List Styling */
    .level1-scroll-list {
      overflow-y: scroll !important;
      scrollbar-width: thin;
      scrollbar-color: rgba(140, 135, 125, 0.45) transparent;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    .level1-scroll-list::-webkit-scrollbar {
      width: 6px;
    }
    .level1-scroll-list::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.04);
      border-radius: 9999px;
    }
    .dark .level1-scroll-list::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.04);
    }
    .level1-scroll-list::-webkit-scrollbar-thumb {
      background: rgba(120, 115, 105, 0.4);
      border-radius: 9999px;
    }
    .dark .level1-scroll-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.28);
    }
    .level1-scroll-list::-webkit-scrollbar-thumb:hover {
      background: rgba(120, 115, 105, 0.7);
    }
    .dark .level1-scroll-list::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    /* Ambient Warm Background with Soft Viscous Caustics */
    body {
      background-color: #EFECE6;
      background-image: 
        radial-gradient(ellipse at 15% 15%, rgba(255, 255, 255, 0.9) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 85%, rgba(0, 194, 209, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 45%, rgba(230, 93, 79, 0.05) 0%, transparent 65%),
        linear-gradient(135deg, #F4F1EB 0%, #E9E4DC 50%, #E2DDD5 100%);
      background-attachment: fixed;
      transition: background-color 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    html.dark body {
      background-color: #080A0E !important;
      background-image: 
        radial-gradient(ellipse at 15% 15%, rgba(0, 194, 209, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 85%, rgba(230, 93, 79, 0.1) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 50%, rgba(138, 92, 246, 0.08) 0%, transparent 60%),
        linear-gradient(135deg, #07090C 0%, #0E1218 50%, #06080B 100%) !important;
      background-attachment: fixed;
    }

    /* Liquid Glass Panels (Organic Smooth Curves) */
    .liquid-panel {
      position: relative;
      background: linear-gradient(
        135deg, 
        rgba(255, 255, 255, 0.82) 0%, 
        rgba(247, 244, 238, 0.58) 50%, 
        rgba(255, 255, 255, 0.75) 100%
      );
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 
        inset 0 1.5px 2px rgba(255, 255, 255, 0.95),
        inset 0 -1px 2px rgba(0, 0, 0, 0.04),
        0 16px 36px -10px rgba(45, 40, 35, 0.1);
    }

    .dark .liquid-panel {
      background: linear-gradient(
        135deg, 
        rgba(255, 255, 255, 0.12) 0%, 
        rgba(20, 25, 33, 0.65) 50%, 
        rgba(0, 194, 209, 0.06) 100%
      );
      backdrop-filter: blur(32px) saturate(190%);
      -webkit-backdrop-filter: blur(32px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 
        inset 0 1.5px 2px rgba(255, 255, 255, 0.35),
        inset 0 -1.5px 2px rgba(0, 0, 0, 0.6),
        0 20px 48px -10px rgba(0, 0, 0, 0.7);
    }

    /* Stage Canvas Liquid Glass */
    .liquid-stage-glass {
      position: relative;
      background: radial-gradient(
        circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(255, 255, 255, 0.55) 0%,
        rgba(250, 248, 243, 0.6) 45%,
        rgba(240, 236, 228, 0.72) 100%
      );
      backdrop-filter: blur(36px) saturate(210%);
      -webkit-backdrop-filter: blur(36px) saturate(210%);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      box-shadow: 
        inset 0 2px 4px rgba(255, 255, 255, 0.95),
        inset 0 -2px 3px rgba(0, 0, 0, 0.05),
        0 24px 50px -12px rgba(35, 30, 25, 0.1);
    }

    .dark .liquid-stage-glass {
      background: radial-gradient(
        circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(0, 194, 209, 0.1) 0%,
        rgba(18, 23, 31, 0.72) 45%,
        rgba(10, 13, 18, 0.88) 100%
      );
      backdrop-filter: blur(40px) saturate(210%);
      -webkit-backdrop-filter: blur(40px) saturate(210%);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      box-shadow: 
        inset 0 2px 4px rgba(255, 255, 255, 0.4),
        inset 0 -2px 4px rgba(0, 0, 0, 0.8),
        0 25px 60px rgba(0, 0, 0, 0.8);
    }

    /* Fluid Caustic Floating Glare */
    .liquid-caustic-layer {
      position: absolute;
      inset: -40%;
      background: 
        radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.3) 0%, transparent 40%),
        radial-gradient(circle at 65% 65%, rgba(0, 194, 209, 0.14) 0%, transparent 45%),
        radial-gradient(circle at 50% 80%, rgba(230, 93, 79, 0.1) 0%, transparent 40%);
      filter: blur(35px);
      animation: liquidDrift 16s ease-in-out infinite alternate;
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    @keyframes liquidDrift {
      0% { transform: rotate(0deg) scale(1) translate(0px, 0px); }
      50% { transform: rotate(180deg) scale(1.12) translate(25px, -20px); }
      100% { transform: rotate(360deg) scale(0.96) translate(-20px, 20px); }
    }

    /* Fluid Sheen Sweep on Hover */
    .liquid-btn {
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .liquid-btn::after {
      content: '';
      position: absolute;
      top: -120%;
      left: -150%;
      width: 300%;
      height: 300%;
      background: linear-gradient(
        60deg,
        transparent 35%,
        rgba(255, 255, 255, 0.45) 50%,
        transparent 65%
      );
      opacity: 0;
      transform: rotate(25deg);
      transition: opacity 0.3s ease, transform 0.6s ease;
      pointer-events: none;
    }

    .liquid-btn:hover::after {
      opacity: 1;
      transform: rotate(25deg) translate(35%, 35%);
    }

    /* Transitions */
    .menu-slide-enter {
      animation: menuSlideIn 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes menuSlideIn {
      from {
        opacity: 0;
        transform: translateX(-16px);
        filter: blur(3px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
        filter: blur(0);
      }
    }

    .menu-slide-back {
      animation: menuSlideBack 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes menuSlideBack {
      from {
        opacity: 0;
        transform: translateX(16px);
        filter: blur(3px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
        filter: blur(0);
      }
    }

    /* Left Dock Collapsing Animation */
    .dock-collapsed {
      max-width: 0 !important;
      width: 0 !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
      margin-left: 0 !important;
      margin-right: -0.75rem !important;
      opacity: 0 !important;
      transform: translateX(-24px) scale(0.9) !important;
      pointer-events: none !important;
      overflow: hidden !important;
      border: none !important;
    }

    /* Submenus Shifted to the Left to Maximize Workspace */
    .submenu-shifted {
      transform: translateX(-0.75rem);
    }
    @media (min-width: 1024px) {
      .submenu-shifted {
        transform: translateX(-1.5rem);
        width: 18.5rem !important;
      }
    }

    /* Level 3: Ultra-Compact Single Vertical Column */
    .level3-nav-compact {
      width: 4.5rem !important;
      min-width: 4.5rem !important;
      max-width: 4.5rem !important;
      align-items: center !important;
      transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @media (min-width: 640px) {
      .level3-nav-compact {
        width: 5rem !important;
        min-width: 5rem !important;
        max-width: 5rem !important;
      }
    }

    /* Dock Switch Keyframe Animation */
    @keyframes dockSwitchPop {
      0% { transform: scale(0.9); }
      40% { transform: scale(1.16); }
      100% { transform: scale(1); }
    }
    .dock-switch-active {
      animation: dockSwitchPop 0.36s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      background: rgba(255, 255, 255, 0.95) !important;
      color: #1A1D20 !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12) !important;
    }
    .dark .dock-switch-active {
      background: rgba(255, 255, 255, 0.25) !important;
      color: #FFFFFF !important;
      box-shadow: 0 4px 20px rgba(0, 194, 209, 0.25) !important;
    }

    /* Slide Switch for Dock Sets */
    @keyframes dockSlideSwitch {
      0% {
        opacity: 0;
        transform: translateY(24px);
        filter: blur(3px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }
    .dock-slide-anim {
      animation: dockSlideSwitch 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Initial Long Bars Animation */
    .bars-enter-anim {
      animation: barsEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes barsEnter {
      0% {
        opacity: 0;
        transform: translateX(-24px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    /* Level 1 3D Infinite Rotary Wheel */
    .wheel-stage {
      position: relative;
      width: 100%;
      height: 100%;
      perspective: 1100px;
      perspective-origin: center center;
      transform-style: preserve-3d;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: none;
      overflow: hidden;
      mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
    }

    .wheel-item {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 132px;
      margin-top: -66px;
      transform-style: preserve-3d;
      will-change: transform, opacity;
      cursor: pointer;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
      backface-visibility: hidden;
    }

    .wheel-item-active {
      box-shadow: 0 16px 36px -6px rgba(0, 0, 0, 0.18), inset 0 2px 2px rgba(255, 255, 255, 0.95) !important;
      border-color: rgba(255, 255, 255, 0.95) !important;
    }

    .dark .wheel-item-active {
      box-shadow: 0 16px 40px -8px rgba(0, 194, 209, 0.3), inset 0 1.5px 2px rgba(255, 255, 255, 0.4) !important;
      border-color: rgba(0, 194, 209, 0.6) !important;
    }
  </style>
</head>

<body class="text-liquid-charcoal dark:text-[#E8ECF2] font-sans antialiased h-screen max-h-screen flex flex-col justify-between items-center p-3 sm:p-4 lg:p-6 relative overflow-hidden select-none">

  <!-- Ambient Fluid Light Drops in Background -->

  <div class="absolute -bottom-36 -right-36 w-[28rem] h-[28rem] rounded-full bg-rose-400/20 dark:bg-rose-500/12 blur-3xl pointer-events-none animate-pulse" style="animation-duration: 7s;"></div>

  <!-- Top Fluid Header -->
  <header class="w-full max-w-6xl rounded-3xl liquid-panel px-6 py-3 flex items-center justify-between gap-4 z-30 transition-all duration-300 mb-3 sm:mb-5 relative">
    
    <!-- Home Button & System Callout -->
    <div class="flex items-center space-x-3 sm:space-x-3.5">
      <button id="btnTopHome" title="Volver a la página principal" class="liquid-btn w-9 h-9 rounded-2xl bg-white/90 dark:bg-white/15 flex items-center justify-center text-stone-800 dark:text-stone-200 hover:text-stone-950 dark:hover:text-white hover:bg-white dark:hover:bg-white/25 hover:scale-105 active:scale-95 transition-all shadow-sm border border-white/60 dark:border-white/20 group">
        <svg class="w-4 h-4 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>

      </button>
      <div>
        <div class="flex items-center space-x-2">
          <span class="text-xs sm:text-sm font-sans font-semibold tracking-tight text-stone-900 dark:text-stone-100">ESPACIO EDITORIAL</span>
          <span class="text-xs font-mono px-2 py-0.5 rounded-full bg-black/5 dark:bg-white/10 text-stone-600 dark:text-stone-300 tracking-wider">LIQUID.03</span>
        </div>
        <span id="headerPath" class="hidden md:inline-block text-xs font-mono text-stone-500 dark:text-stone-400 opacity-90 tracking-wider">// MENÚ PRINCIPAL</span>
      </div>
    </div>

    <!-- Social Links (LinkedIn, Behance, Mail) -->
    <div class="flex items-center space-x-1.5 sm:space-x-2.5 bg-black/5 dark:bg-black/40 px-2.5 sm:px-3.5 py-1.5 rounded-full border border-white/60 dark:border-white/10 shadow-inner">
      <!-- Icono LinkedIn -->
      <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" title="LinkedIn" class="liquid-btn w-9 h-9 sm:w-10 sm:h-10 rounded-full flex items-center justify-center text-stone-700 dark:text-stone-300 hover:text-stone-950 dark:hover:text-white hover:bg-white/80 dark:hover:bg-white/20 hover:scale-110 active:scale-95 transition-all duration-200">
        <svg class="w-4.5 h-4.5 sm:w-5 sm:h-5 fill-current" viewBox="0 0 24 24">
          <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>

        <svg class="w-4.5 h-4.5 sm:w-5 sm:h-5 fill-current" viewBox="0 0 24 24">
          <path d="M22 7h-7V5h7v2zm-2.4 8.7c0-2.8-1.9-4.7-4.6-4.7-2.8 0-4.8 2-4.8 4.7 0 2.9 2 4.8 5 4.8 2 0 3.6-1.1 4.2-2.5h-2.2c-.4.5-1.1.8-1.9.8-1.3 0-2.1-.8-2.3-2.1h6.6v-1zm-6.5-1c.2-1.1.9-1.8 1.9-1.8s1.7.7 1.8 1.8h-3.7zM8.7 11.2c.9-.5 1.5-1.4 1.5-2.6 0-2.2-1.7-3.6-4.2-3.6H1v14h5.2c2.7 0 4.6-1.6 4.6-4 0-1.7-1-3.2-2.1-3.8zm-4.9-4h2c1.2 0 1.9.6 1.9 1.6 0 1-.7 1.7-1.9 1.7h-2V7.2zm2.3 9.7h-2.3v-4.1h2.3c1.4 0 2.2.8 2.2 2 0 1.3-.8 2.1-2.2 2.1z"/>

      <!-- Icono Mail -->
      <a href="mailto:contact@liquid.editorial" title="Contacto por Correo" class="liquid-btn w-9 h-9 sm:w-10 sm:h-10 rounded-full flex items-center justify-center text-stone-700 dark:text-stone-300 hover:text-stone-950 dark:hover:text-white hover:bg-white/80 dark:hover:bg-white/20 hover:scale-110 active:scale-95 transition-all duration-200">

        </svg>

    </div>

    <!-- Right Controls: Light / Dark Mode -->
    <div class="flex items-center space-x-2 sm:space-x-3 font-mono">
      
      <!-- Theme Switcher with Smooth Rounded Pill Toggle -->
      <div class="flex items-center bg-black/5 dark:bg-black/50 p-1 rounded-full border border-white/60 dark:border-white/10 text-xs shadow-inner">
        <button id="btnLightMode" class="liquid-btn flex items-center space-x-1.5 px-3 py-1 rounded-full bg-white text-stone-900 dark:text-stone-400 font-semibold shadow-sm transition">
          <span class="w-1.5 h-1.5 rounded-full bg-amber-500 inline-block"></span>
          <span class="hidden sm:inline text-xs tracking-wider">CLARO</span>

          <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 inline-block"></span>
          <span class="hidden sm:inline text-xs tracking-wider">OSCURO</span>

      </div>

    </div>

  </header>

  <main class="w-full max-w-6xl flex-1 min-h-0 h-full max-h-[calc(100vh-5.5rem)] flex flex-col md:flex-row items-stretch gap-4 sm:gap-6 relative z-10">
    
    <!-- INITIAL VIEW: 3 Long Bars on the Left ("Texto 1", "Texto 2", "Texto 3") -->
    <div id="initialBarsContainer" class="flex flex-col justify-between gap-3 sm:gap-4 w-full md:w-80 lg:w-96 shrink-0 transition-all duration-500 ease-out z-20 bars-enter-anim self-stretch">
      
      <!-- Long Bar 1: Pluma Vectorial (Texto 1) -->
      <button id="initialBarA" data-mode="A" class="initial-bar-btn liquid-btn flex-1 w-full text-left p-4 sm:p-5 rounded-3xl liquid-panel hover:bg-white/90 dark:hover:bg-white/20 hover:scale-[1.01] active:scale-[0.99] transition-all flex flex-col justify-between group shadow-liquid-md border border-white/90 dark:border-white/20">
        <!-- Top Row: Icon + Title + Arrow -->
        <div class="flex items-center justify-between w-full mb-2">
          <div class="flex items-center space-x-3.5">
            <div class="w-11 h-11 rounded-2xl bg-white/90 dark:bg-white/20 text-stone-900 dark:text-white flex items-center justify-center shadow-sm border border-white/80 dark:border-white/30 group-hover:scale-110 transition-transform">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l7-7 3 3-7 7-3-3z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2 2l7.586 7.586"/>
                <circle cx="11" cy="11" r="1.5" stroke-width="1.8"/>
              </svg>

  <script>
    // Audio Feedback Synthesis (Web Audio API)
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let soundEnabled = true;

    function playTacticalSound(kind = 'tap') {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new AudioContextClass();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (kind === 'tap') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(320, now + 0.04);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);
          osc.start(now);
          osc.stop(now + 0.04);
        } else if (kind === 'drillDown') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(480, now);
          osc.frequency.exponentialRampToValueAtTime(960, now + 0.07);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.07);
          osc.start(now);
          osc.stop(now + 0.07);
        } else if (kind === 'modeSwitch') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(650, now + 0.09);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
          osc.start(now);
          osc.stop(now + 0.09);
        } else if (kind === 'back') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(620, now);
          osc.frequency.exponentialRampToValueAtTime(350, now + 0.06);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);
          osc.start(now);
          osc.stop(now + 0.06);
        }
      } catch(e) {}
    }

      wheelTargetOffset = Math.round(wheelTargetOffset / step) * step;
    }

    function onWheelRotate(deltaY, customStep = itemStep) {
      wheelTargetOffset += deltaY * 0.85;
      if (snapTimeout) clearTimeout(snapTimeout);
      snapTimeout = setTimeout(() => snapToNearestCard(customStep), 160);
    }

      isInitialState = false;
      currentMode = mode;

      selectedNode = datasets[currentMode];

      // Hide the initial long bars container
      initialBarsContainer.classList.add('hidden');
      initialBarsContainer.classList.remove('flex');

      // Reveal the small icon dock rail and the submenu column
      leftDock.classList.remove('hidden');
      leftDock.classList.add('flex', 'dock-slide-anim');

      submenuNav.classList.remove('hidden');
      submenuNav.classList.add('flex');

      // Update active dock item visuals
      updateDockActiveVisuals();

      // Clear hover and render level 1 submenus
      clearStageHover();
      renderVerticalMenu('forward');
      updateHeaderBreadcrumb();
    }

      isInitialState = true;
      playTacticalSound('back');

      // Hide dock and submenus
      leftDock.classList.add('hidden');
      leftDock.classList.remove('flex');

      submenuNav.classList.add('hidden');
      submenuNav.classList.remove('flex');

      // Re-display the 3 long bars container
      initialBarsContainer.classList.remove('hidden');
      initialBarsContainer.classList.add('flex', 'bars-enter-anim');

      navigationStack = [datasets[currentMode]];
      selectedNode = datasets[currentMode];

      clearStageHover();
      updateHeaderBreadcrumb();

      } else {
        if (leftDock) leftDock.classList.remove('dock-collapsed');
        if (submenuNav) submenuNav.classList.remove('submenu-shifted');
      }
    }

          <span class="text-xs font-mono px-2 py-0.5 rounded-full bg-black/5 dark:bg-white/10 tracking-wider">INICIO</span>
        `;
        btnReturn.title = "Volver a la selección inicial";
      } else if (isLevel3) {
        btnReturn.className = "liquid-btn shrink-0 flex items-center justify-center px-3 py-2.5 rounded-2xl liquid-panel text-xs font-mono font-bold text-stone-800 dark:text-stone-200 hover:bg-white/90 dark:hover:bg-white/20 hover:scale-105 transition-all group w-12 sm:w-14 mb-1.5 shadow-sm";
        btnReturn.innerHTML = `
          <span class="text-stone-900 dark:text-white font-bold text-base">&larr;</span>
        `;
        btnReturn.title = "Volver al nivel anterior";
      } else {
        btnReturn.className = "liquid-btn shrink-0 flex items-center justify-between px-5 py-3 rounded-2xl liquid-panel text-xs font-mono font-semibold text-stone-800 dark:text-stone-200 hover:bg-white/90 dark:hover:bg-white/20 hover:scale-[1.01] transition-all group w-full mb-1 shadow-sm";
        btnReturn.innerHTML = `
          <div class="flex items-center space-x-2">
            <span class="text-stone-900 dark:text-white font-bold">&larr;</span>
            <span class="tracking-wider uppercase">VOLVER AL NIVEL ANTERIOR</span>
          </div>
          <span id="currentLevelTag" class="text-xs font-mono px-2 py-0.5 rounded-full bg-black/5 dark:bg-white/10 tracking-wider">NIVEL 0${currentDepth}</span>

        btnReturn.title = "";

      // Container Class Configurations based on level
      if (isLevel1) {

        verticalButtonsStack.className = "flex-1 min-h-0 h-full w-full wheel-stage";
        verticalButtonsStack.onscroll = null;
      } else if (isLevel3) {
        stopLevel1Wheel();
        submenuNav.classList.add('level3-nav-compact');
        verticalButtonsStack.className = "flex-1 min-h-0 flex flex-col justify-between gap-1.5 sm:gap-2 items-center w-full h-full";
      }

      verticalButtonsStack.innerHTML = '';
      const listToRender = current.children || current.items || [];

      if (listToRender.length === 0) {
        verticalButtonsStack.innerHTML = `
          <div class="p-3 text-center rounded-2xl liquid-panel text-xs font-mono text-stone-500 dark:text-stone-400">

          </div>
        `;
        return;
      }

      // LEVEL 1 & LEVEL 2 & LEVEL 3: Garantizar que siempre haya un elemento seleccionado visible en el lienzo
      if (isLevel1 || isLevel2 || isLevel3) {
        const found = listToRender.some(it => it.id === selectedNode?.id);
        if (!found) {
          selectedNode = listToRender[0];
        }
        showStageHover(selectedNode);
      }

      if (isLevel1) {
        wheelElements = [];
        const totalItems = listToRender.length;
        const totalHeight = totalItems * itemStep;

        listToRender.forEach((item, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = "wheel-item liquid-panel rounded-2xl sm:rounded-3xl p-5 text-left flex flex-col justify-between border border-white/80 dark:border-white/20 select-none";

          button.innerHTML = `
            <div class="flex items-center justify-between w-full mb-1">
              <div class="flex items-center space-x-2.5">
                <div class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-mono font-bold shrink-0 bg-stone-900 text-white dark:bg-white dark:text-stone-900 shadow-sm">
                  ${index + 1 < 10 ? `0${index + 1}` : index + 1}
                </div>
                <span class="text-xs sm:text-sm font-sans font-semibold tracking-wide block text-stone-900 dark:text-white truncate">
                  ${item.title}
                </span>
              </div>
              <div class="flex items-center space-x-1.5 shrink-0">
                <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-black/5 dark:bg-white/10 text-stone-500 dark:text-stone-400">
                  ${item.children ? item.children.length : 0} SUB
                </span>
                <div class="w-4 h-4 flex items-center justify-center font-mono text-xs text-stone-400">
                  &rarr;
                </div>
              </div>
            </div>
            <p class="text-xs sm:text-[12.5px] font-sans text-stone-600 dark:text-stone-300 leading-relaxed my-1 line-clamp-3">
              ${item.desc || 'Configuración y parámetros para calibrar el módulo en el espacio editorial.'}
            </p>
            <div class="flex items-center justify-between pt-1.5 border-t border-black/5 dark:border-white/10 text-[10px] sm:text-[11px] font-mono text-stone-500 dark:text-stone-400">
              <span class="tracking-wider">// ${item.code || `SYS_0${index + 1}`}</span>
              <span class="tracking-widest uppercase opacity-75">${item.category || 'MÓDULO'}</span>
            </div>
          `;

          button.addEventListener('click', (e) => {
            e.stopPropagation();
            if (hasDragged) {
              return;
            }
            playTacticalSound('drillDown');
            selectedNode = item;
            navigationStack.push(item);
            renderVerticalMenu('forward');
            updateHeaderBreadcrumb();
            clearStageHover();
          });

          verticalButtonsStack.appendChild(button);
          wheelElements.push({ el: button, item, index });
        });

        // Pointer drag interaction on wheel
        verticalButtonsStack.onpointerdown = (e) => {
          isWheelDragging = true;
          hasDragged = false;
          wheelDragStartY = e.clientY;
          wheelStartOffset = wheelTargetOffset;
          if (snapTimeout) clearTimeout(snapTimeout);
        };

        const handlePointerMove = (e) => {
          if (!isWheelDragging) return;
          const delta = e.clientY - wheelDragStartY;
          if (Math.abs(delta) > 6) {
            hasDragged = true;
          }
          wheelTargetOffset = wheelStartOffset - delta * 1.15;

        const handlePointerUp = () => {
          if (!isWheelDragging) return;
          isWheelDragging = false;
          snapToNearestCard(itemStep);
          setTimeout(() => {
            hasDragged = false;
          }, 80);
        };

        window.removeEventListener('pointermove', handlePointerMove);
        window.removeEventListener('pointerup', handlePointerUp);
        window.addEventListener('pointermove', handlePointerMove);
        window.addEventListener('pointerup', handlePointerUp);

        // Cylindrical Drum Loop: Flat in center, curved only at top/bottom extremes
        stopLevel1Wheel();
        function updateWheelLoop() {
          wheelCurrentOffset += (wheelTargetOffset - wheelCurrentOffset) * 0.14;

          const flatZoneLimit = 215; // Kept proportional to 206px card height
          const curveRadius = 240;   // Smooth radius of curvature when rolling over the edges

          let minAbsDist = Infinity;
          let activeIdx = 0;

          wheelElements.forEach(({ el, index }) => {
            const rawY = (index * itemStep) - wheelCurrentOffset;
            const y = ((rawY % totalHeight) + totalHeight * 1.5) % totalHeight - (totalHeight / 2);

            let curY = y;
            let curZ = 0;
            let curRotX = 0;
            let opacity = 1;

            if (Math.abs(y) <= flatZoneLimit) {
              curY = y;
              curZ = 0;
              curRotX = 0;
              opacity = 1;
            } else if (y < -flatZoneLimit) {
              const excess = -flatZoneLimit - y;
              const theta = Math.min(Math.PI * 0.52, excess / curveRadius);
              curY = -flatZoneLimit - curveRadius * Math.sin(theta);
              curZ = -curveRadius * (1 - Math.cos(theta));
              curRotX = -(theta * (180 / Math.PI));
              opacity = Math.max(0, Math.cos(theta * 0.95));
            } else {
              const excess = y - flatZoneLimit;
              const theta = Math.min(Math.PI * 0.52, excess / curveRadius);
              curY = flatZoneLimit + curveRadius * Math.sin(theta);
              curZ = -curveRadius * (1 - Math.cos(theta));
              curRotX = +(theta * (180 / Math.PI));
              opacity = Math.max(0, Math.cos(theta * 0.95));
            }

            if (opacity <= 0.02 || Math.abs(y) > (totalHeight / 2) - 10) {
              el.style.display = 'none';
            } else {
              el.style.display = 'flex';
              el.style.transform = `translate3d(0, ${curY.toFixed(2)}px, ${curZ.toFixed(2)}px) rotateX(${curRotX.toFixed(2)}deg)`;
              el.style.opacity = opacity.toFixed(3);

              if (Math.abs(y) < minAbsDist) {
                minAbsDist = Math.abs(y);
                activeIdx = index;
              }
            }
          });

          wheelElements.forEach(({ el }, idx) => {
            if (idx === activeIdx) {
              el.classList.add('wheel-item-active', 'bg-white/95', 'dark:bg-white/25');
              el.classList.remove('bg-white/70', 'dark:bg-white/10');
            } else {
              el.classList.remove('wheel-item-active', 'bg-white/95', 'dark:bg-white/25');
              el.classList.add('bg-white/70', 'dark:bg-white/10');
            }
          });

          if (activeIdx !== lastCenteredIndex && listToRender[activeIdx]) {
            lastCenteredIndex = activeIdx;
            selectedNode = listToRender[activeIdx];
            showStageHover(selectedNode);
            playTacticalSound('tap');
          }

          wheelRafId = requestAnimationFrame(updateWheelLoop);
        }

        updateWheelLoop();
        return;
      }

      if (isLevel2) {
        wheelElements = [];
        const baseItems = listToRender;

        wheelTargetOffset = 0;

            button.style.marginTop = `-${l2CardHeight / 2}px`;

            button.innerHTML = `
              <div class="flex items-center justify-between w-full mb-1">
                <div class="flex items-center space-x-2.5">
                  <div class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-mono font-bold shrink-0 bg-stone-900 text-white dark:bg-white dark:text-stone-900 shadow-sm">
                    ${baseIndex + 1 < 10 ? `0${baseIndex + 1}` : baseIndex + 1}
                  </div>
                  <div>
                    <span class="text-sm sm:text-base font-sans font-semibold tracking-wide block truncate text-stone-900 dark:text-white">
                      ${item.title}
                    </span>
                    <span class="text-[10px] font-mono tracking-wider text-stone-500 dark:text-stone-400 block -mt-0.5">
                      // CONFIGURACIÓN DINÁMICA

                <div class="flex items-center space-x-1.5 shrink-0">
                  ${hasSubOptions ? `
                    <span class="text-[10px] sm:text-xs font-mono px-2 py-0.5 rounded-full bg-black/5 dark:bg-white/10 text-stone-500 dark:text-stone-400">
                      ${item.children.length} CANALES
                    </span>
                  ` : ''}
                  <div class="w-5 h-5 flex items-center justify-center font-mono text-xs sm:text-sm text-stone-400">
                    ${hasSubOptions ? '&rarr;' : '&bull;'}
                  </div>
                </div>

              <!-- Fila central: Icono mediano a la izquierda con color dinámico + Descripción rica -->

                    <path d="M12.32,89.55c.23-2.46,1.41-4.34,3-5.9-.09-.05-.18-.11-.27-.17-2.32-.93-6.62-4.17-8.49-5.38,0,0-.01,0-.02.01-1.46,1.37-2.81,2.87-3.57,4.66-.95,2.26-.56,6.32.35,8.66,1.22,3.13,5.45,6.26,8.55,7.94.75.41,3.35,1.74,3.74.42.11-.36-.12-.96-.31-1.22-1.88-2.5-3.27-5.86-2.98-9.02Z"/>
                  </svg>
                </div>

                <!-- Texto descriptivo enriquecido -->
                <p class="text-xs sm:text-[12px] font-sans text-stone-600 dark:text-stone-300 leading-relaxed line-clamp-3 flex-1">
                  ${item.desc}
                </p>
              </div>

              <div class="flex items-center justify-between pt-1.5 border-t border-black/5 dark:border-white/10 text-[11px] font-mono text-stone-500 dark:text-stone-400">
                <span class="tracking-wider flex items-center space-x-1.5">
                  <span class="w-1.5 h-1.5 rounded-full inline-block" style="background-color: ${itemColor};"></span>
                  <span>// ${item.code || `OPT_0${baseIndex + 1}`}</span>
                </span>
                <span class="text-[10px] tracking-widest uppercase opacity-85 font-semibold" style="color: ${itemColor};">
                  ${item.category || 'PARÁMETRO'}
                </span>
              </div>
            `;

            button.addEventListener('click', (e) => {
              e.stopPropagation();
              if (hasDragged) return;
              if (hasSubOptions) {
                playTacticalSound('drillDown');
                navigationStack.push(item);
                // Situar automáticamente en el primer elemento del nivel 3
                selectedNode = item.children[0];
                renderVerticalMenu('forward');
                updateHeaderBreadcrumb();
                showStageHover(selectedNode);
              } else {
                selectedNode = item;
                playTacticalSound('tap');
                showStageHover(item);
              }
            });

            verticalButtonsStack.appendChild(button);
            wheelElements.push({ el: button, item, index, baseIndex });
          });
        }

        // Pointer drag interaction para Nivel 2
        verticalButtonsStack.onpointerdown = (e) => {
          isWheelDragging = true;
          hasDragged = false;
          wheelDragStartY = e.clientY;
          wheelStartOffset = wheelTargetOffset;
          if (snapTimeout) clearTimeout(snapTimeout);
        };

        const handlePointerMoveL2 = (e) => {
          if (!isWheelDragging) return;
          const delta = e.clientY - wheelDragStartY;
          if (Math.abs(delta) > 6) {
            hasDragged = true;
          }
          wheelTargetOffset = wheelStartOffset - delta * 1.15;
        };

        const handlePointerUpL2 = () => {
          if (!isWheelDragging) return;
          isWheelDragging = false;
          snapToNearestCard(l2Step);
          setTimeout(() => {
            hasDragged = false;
          }, 80);
        };

        window.removeEventListener('pointermove', handlePointerMoveL2);
        window.removeEventListener('pointerup', handlePointerUpL2);
        window.addEventListener('pointermove', handlePointerMoveL2);
        window.addEventListener('pointerup', handlePointerUpL2);

        // Bucle 3D para Nivel 2: plano en el centro y curvatura en bordes
        stopLevel1Wheel();
        function updateWheelLoopL2() {
          wheelCurrentOffset += (wheelTargetOffset - wheelCurrentOffset) * 0.14;

          const flatZoneLimit = 165;
          const curveRadius = 210;

          let minAbsDist = Infinity;
          let activeBaseIdx = 0;

          wheelElements.forEach(({ el, index, baseIndex }) => {
            const rawY = (index * l2Step) - wheelCurrentOffset;
            const y = ((rawY % totalHeight) + totalHeight * 1.5) % totalHeight - (totalHeight / 2);

            let curY = y;
            let curZ = 0;
            let curRotX = 0;
            let opacity = 1;

            if (Math.abs(y) <= flatZoneLimit) {
              curY = y;
              curZ = 0;
              curRotX = 0;
              opacity = 1;
            } else if (y < -flatZoneLimit) {
              const excess = -flatZoneLimit - y;
              const theta = Math.min(Math.PI * 0.52, excess / curveRadius);
              curY = -flatZoneLimit - curveRadius * Math.sin(theta);
              curZ = -curveRadius * (1 - Math.cos(theta));
              curRotX = -(theta * (180 / Math.PI));
              opacity = Math.max(0, Math.cos(theta * 0.95));
            } else {
              const excess = y - flatZoneLimit;
              const theta = Math.min(Math.PI * 0.52, excess / curveRadius);
              curY = flatZoneLimit + curveRadius * Math.sin(theta);
              curZ = -curveRadius * (1 - Math.cos(theta));
              curRotX = +(theta * (180 / Math.PI));
              opacity = Math.max(0, Math.cos(theta * 0.95));
            }

            if (opacity <= 0.02 || Math.abs(y) > (totalHeight / 2) - 10) {
              el.style.display = 'none';
            } else {
              el.style.display = 'flex';
              el.style.transform = `translate3d(0, ${curY.toFixed(2)}px, ${curZ.toFixed(2)}px) rotateX(${curRotX.toFixed(2)}deg)`;
              el.style.opacity = opacity.toFixed(3);

              if (Math.abs(y) < minAbsDist) {
                minAbsDist = Math.abs(y);
                activeBaseIdx = baseIndex;
              }
            }
          });

          wheelElements.forEach(({ el, baseIndex }) => {
            if (baseIndex === activeBaseIdx) {
              el.classList.add('wheel-item-active', 'bg-white/95', 'dark:bg-white/25');
              el.classList.remove('bg-white/70', 'dark:bg-white/10');
            } else {
              el.classList.remove('wheel-item-active', 'bg-white/95', 'dark:bg-white/25');
              el.classList.add('bg-white/70', 'dark:bg-white/10');
            }
          });

          if (activeBaseIdx !== lastCenteredIndex && baseItems[activeBaseIdx]) {
            lastCenteredIndex = activeBaseIdx;
            selectedNode = baseItems[activeBaseIdx];
            showStageHover(selectedNode);
            playTacticalSound('tap');
          }

          wheelRafId = requestAnimationFrame(updateWheelLoopL2);
        }

        updateWheelLoopL2();
        return;
      }

      // RENDER ITEMS FOR LEVEL 3
      listToRender.forEach((item, index) => {
        const isSelected = selectedNode && selectedNode.id === item.id;
        const button = document.createElement('button');
        button.type = 'button';
        button.style.animation = `menuSlideIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) ${index * 0.02}s both`;

        const numberLabel = item.num || (index + 1 < 10 ? `0${index + 1}` : `${index + 1}`);
        button.className = `liquid-btn flex-1 min-h-0 w-full flex flex-col items-center justify-center rounded-2xl liquid-panel transition-all duration-200 group ${
          isSelected
            ? 'bg-white dark:bg-white/30 text-stone-950 dark:text-white scale-[1.03] shadow-md font-bold'
            : 'hover:scale-[1.02] hover:bg-white/80 dark:hover:bg-white/20 text-stone-800 dark:text-stone-200 shadow-sm'
        }`;

        button.innerHTML = `
          <span class="l3-num font-mono text-xl sm:text-2xl font-bold tracking-wider ${
            isSelected ? 'text-stone-950 dark:text-white' : 'text-stone-700 dark:text-stone-300 group-hover:text-stone-950 dark:group-hover:text-white'
          }">
            ${numberLabel}
          </span>
          <span class="l3-dot ${
            isSelected 
              ? 'w-1.5 h-1.5 rounded-full bg-stone-900 dark:bg-cyan-400 mt-1' 
              : 'w-1 h-1 rounded-full bg-stone-400 dark:bg-stone-500 opacity-40 mt-1'
          }"></span>
        `;

        button.addEventListener('mouseenter', () => {
          selectedNode = item;
          updateLevel3ActiveButtons(index);
          showStageHover(item);
        });

        button.addEventListener('click', () => {
          selectedNode = item;
          playTacticalSound('tap');
          updateLevel3ActiveButtons(index);
          showStageHover(item);
        });

        verticalButtonsStack.appendChild(button);
      });
    }

    // Actualiza de manera fluida y sin re-renderizado los botones del Nivel 3
    function updateLevel3ActiveButtons(selectedIndex) {
      const buttons = verticalButtonsStack.querySelectorAll('button');
      buttons.forEach((btn, idx) => {
        const isSel = idx === selectedIndex;
        const numSpan = btn.querySelector('.l3-num');
        const dotSpan = btn.querySelector('.l3-dot');
        if (isSel) {
          btn.className = "liquid-btn flex-1 min-h-0 w-full flex flex-col items-center justify-center rounded-2xl liquid-panel transition-all duration-200 group bg-white dark:bg-white/30 text-stone-950 dark:text-white scale-[1.03] shadow-md font-bold";
          if (numSpan) numSpan.className = "l3-num font-mono text-xl sm:text-2xl font-bold tracking-wider text-stone-950 dark:text-white";
          if (dotSpan) dotSpan.className = "l3-dot w-1.5 h-1.5 rounded-full bg-stone-900 dark:bg-cyan-400 mt-1";
        } else {
          btn.className = "liquid-btn flex-1 min-h-0 w-full flex flex-col items-center justify-center rounded-2xl liquid-panel transition-all duration-200 group hover:scale-[1.02] hover:bg-white/80 dark:hover:bg-white/20 text-stone-800 dark:text-stone-200 shadow-sm";
          if (numSpan) numSpan.className = "l3-num font-mono text-xl sm:text-2xl font-bold tracking-wider text-stone-700 dark:text-stone-300 group-hover:text-stone-950 dark:group-hover:text-white";
          if (dotSpan) dotSpan.className = "l3-dot w-1 h-1 rounded-full bg-stone-400 dark:bg-stone-500 opacity-40 mt-1";
        }
      });
    }

    // Navegación con la rueda del ratón (Scroll Wheel)
    let lastWheelTime = 0;
    window.addEventListener('wheel', (e) => {
      // Exclusivo para el Nivel 3 (longitud del stack = 3)
      if (navigationStack.length === 3) {
        const current = getCurrentTier();
        const items = current.children || current.items || [];
        if (!items || items.length === 0) return;

        e.preventDefault();

        const now = Date.now();
        if (now - lastWheelTime < 130) return;
        lastWheelTime = now;

        let currentIndex = items.findIndex(it => it.id === selectedNode?.id);
        if (currentIndex === -1) currentIndex = 0;

        if (e.deltaY > 0) {
          currentIndex = Math.min(items.length - 1, currentIndex + 1);
        } else if (e.deltaY < 0) {
          currentIndex = Math.max(0, currentIndex - 1);
        }

        selectedNode = items[currentIndex];
        playTacticalSound('tap');
        showStageHover(selectedNode);
        updateLevel3ActiveButtons(currentIndex);
      } else if (navigationStack.length === 1 && !isInitialState) {
        e.preventDefault();
        onWheelRotate(e.deltaY, itemStep);
      } else if (navigationStack.length === 2 && !isInitialState) {
        e.preventDefault();
        onWheelRotate(e.deltaY, 186);
      }
    }, { passive: false });

    // Attach Click and Hover listeners to the Initial 3 Long Bars
    document.querySelectorAll('.initial-bar-btn').forEach(btn => {
      const mode = btn.getAttribute('data-mode');

      btn.addEventListener('mouseenter', () => {
        const preview = initialBarPreviews[mode];
        if (preview) showStageHover(preview);
      });

      btn.addEventListener('mouseleave', () => {
        clearStageHover();
      });

      btn.addEventListener('click', () => {
        playTacticalSound('drillDown');
        enterWorkspace(mode);
      });
    });

    // Return Button Handler
    btnReturn.addEventListener('click', () => {
      if (navigationStack.length > 1) {
        playTacticalSound('back');
        navigationStack.pop();
        const parent = getCurrentTier();
        selectedNode = parent;
        clearStageHover();
        renderVerticalMenu('back');
        updateHeaderBreadcrumb();
      } else if (navigationStack.length === 1) {
        // Return back to the initial 3 long bars
        returnToInitialBars();
      }
    });

    // Reset to Root Home Navigation (Footer Home Icon)
    const btnFooterHome = document.getElementById('btnFooterHome');
    if (btnFooterHome) {
      btnFooterHome.addEventListener('click', () => {
        returnToInitialBars();
      });
    }

    // Reset to Root Home Navigation (Top Header Home Button)
    const btnTopHome = document.getElementById('btnTopHome');
    if (btnTopHome) {
      btnTopHome.addEventListener('click', () => {
        returnToInitialBars();
      });
    }

    // Dock Buttons Handler (A, B, C modes inside workspace)
    const dockButtons = document.querySelectorAll('.dock-item');
    dockButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        const targetMode = btn.getAttribute('data-mode');
        if (currentMode === targetMode && navigationStack.length === 1) return;

        playTacticalSound('modeSwitch');
        currentMode = targetMode;
        updateDockActiveVisuals();

        navigationStack = [datasets[currentMode]];
        selectedNode = datasets[currentMode];
        clearStageHover();
        renderVerticalMenu('dock');
        updateHeaderBreadcrumb();
      });
    });

    // Interactive Liquid Glass Mouse Tracking (Dynamic Specular Caustics)
    if (rightStage) {
      rightStage.addEventListener('mousemove', (e) => {
        const rect = rightStage.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        rightStage.style.setProperty('--mouse-x', `${x}%`);
        rightStage.style.setProperty('--mouse-y', `${y}%`);
      });
    }

    // Theme Switcher Controls
    const btnLightMode = document.getElementById('btnLightMode');
    const btnDarkMode = document.getElementById('btnDarkMode');
    const htmlElement = document.documentElement;

    function applyTheme(isDark) {
      if (isDark) {
        htmlElement.classList.add('dark');
        localStorage.setItem('liquid_theme', 'dark');
        btnDarkMode.className = "flex items-center space-x-1.5 px-3 py-1 rounded-full bg-white/20 text-white font-semibold shadow-sm transition";
        btnLightMode.className = "flex items-center space-x-1.5 px-3 py-1 rounded-full bg-transparent text-stone-400 font-semibold transition";
      } else {
        htmlElement.classList.remove('dark');
        localStorage.setItem('liquid_theme', 'light');
        btnLightMode.className = "flex items-center space-x-1.5 px-3 py-1 rounded-full bg-white text-stone-900 font-semibold shadow-sm transition";
        btnDarkMode.className = "flex items-center space-x-1.5 px-3 py-1 rounded-full bg-transparent text-stone-500 font-semibold transition";
      }
    }

    btnLightMode.addEventListener('click', () => {
      playTacticalSound('tap');
      applyTheme(false);
    });

    btnDarkMode.addEventListener('click', () => {
      playTacticalSound('tap');
      applyTheme(true);
    });

    // Initial setup on window load
    window.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('liquid_theme');
      if (savedTheme === 'dark') {
        applyTheme(true);
      } else {
        applyTheme(false);
      }

      updateHeaderBreadcrumb();
    });
  </script>
